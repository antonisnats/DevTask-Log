<div class="session-container">

<h2>Log New Session</h2>

<label>TASK TITLE</label>
<input
  class="input"
  placeholder="e.g., Refactored Auth Middleware"
  [value]="signalModel().title"
  (input)="updateSignal('title',$any($event.target).value)"
/>

<div class="row">

  <div class="field">
    <label>DATE</label>
    <input
      type="date"
      class="input"
      [value]="signalModel().date"
      (input)="updateSignal('date',$any($event.target).value)"
    />
  </div>

  <div class="field">
    <label>TIME SPENT (H)</label>
    <input
      type="number"
      class="input"
      [value]="signalModel().timeSpent"
      (input)="updateSignal('timeSpent',+$any($event.target).value)"
    />
  </div>

</div>

<label>TECH USED</label>

<div class="tech-list">
  @for (tech of techOptions; track tech) {
    <button
      type="button"
      class="tech-chip"
      (click)="toggleTech(tech)"
      [class.active]="signalModel().techUsed.includes(tech)">
      {{tech}}
    </button>
  }
</div>

<label>WHAT DID YOU LEARN?</label>

<textarea
  class="textarea"
  [value]="signalModel().notes"
  placeholder="Summarize the core insight or technical takeaway..."
  (input)="updateSignal('notes',$any($event.target).value)">
</textarea>

<label>RELATIVE DIFFICULTY</label>

<div class="difficulty">
  @for (level of difficulties; track level) {
    <button
      type="button"
      class="difficulty-btn"
      (click)="setDifficulty(level)"
      [class.active]="signalModel().difficulty === level">
      {{level}}
    </button>
  }
</div>

<button
  class="submit-btn"
  [disabled]="!signalValid"
  (click)="submitSignal()">
  LOG SESSION
</button>

@if (signalErrors().length > 0) {
  <div class="errors">
    @for (err of signalErrors(); track err) {
      <p>{{err}}</p>
    }
  </div>
}

</div>
