<div class="container-fluid">
  <div class="row mt-5">
    <div class="col">
      <div class="col-4">
        <div class="card shadow">
          <div class="card-body">
            <form>
              <div class="mb-3">
                <h4 class="text-dar text-muted">
                  Login
                </h4>
              </div>

              <div class="mb-3">
                <label for="exampleInputEmail1">Email address</label>
                <input type="email" class="form-control" name="email" [(ngModel)]="email" placeholder="Enter email">
              </div>
              <div class="form-group">
                <label for="exampleInputPassword1">Password</label>
                <input type="password" class="form-control" name="password" [(ngModel)]="password" placeholder="Password">
              </div>
              <button type="login" class="btn btn-info" (click)="login()">Login</button>
              <div class="row">
                <div class="col-md-6">
                  <a href="/register" style="text-decoration: none;">New Account ? <span class="text-danger">Register</span></a>
                </div>

                <div class="col-md-6">
                  <a href="" class="text-dark">Forgot Password?</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-6">
      </div>
    </div>
  </div>
</div>
