<div class="login-wrapper">
  <div class="login-card shadow auth-card">
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <h4 class="text-muted">Login</h4>
        </div>

        <div class="mb-3">
          <label>Email address</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Enter email">
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <small class="text-danger">Enter a valid email</small>
          }
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Password">
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <small class="text-danger">Password must be at least 6 characters</small>
          }
        </div>

        <button type="submit" class="btn btn-info w-100 mb-3" [disabled]="loginForm.invalid">Login</button>

        <div class="row">
          <div class="col-md-6">
            <a href="/register" style="text-decoration: none;">New Account? <span class="text-danger">Register</span></a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
