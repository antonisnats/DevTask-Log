<div class="session-container">

  <h2>Log New Session</h2>

  <label>TASK TITLE</label>
  <input class="input" placeholder="e.g., Refactored Auth Middleware" [value]="signalModel().title"
    (input)="updateSignal('title',$any($event.target).value)" />
  @if (signalErrors().title) {
  <small class="text-danger">{{signalErrors().title}}</small>
  }

  <div class="row">

    <div class="field">
      <label>DATE</label>
      <input type="date" class="input" [value]="signalModel().date"
        (input)="updateSignal('date',$any($event.target).value)" />
    </div>

    <div class="field">
      <label>TIME SPENT (H)</label>
      <input type="number" class="input" [value]="signalModel().timeSpent"
        (input)="updateSignal('timeSpent',+$any($event.target).value)" />
      @if (signalErrors().timeSpent) {
      <small class="text-danger">{{signalErrors().timeSpent}}</small>
      }
    </div>

  </div>

  <label>TECH USED</label>
  <div class="tech-list">
    @for (tech of TECH_OPTIONS; track tech) {
    <button mat-stroked-button type="button" class="tech-chip" (click)="toggleTech(tech)"
      [class.active]="signalModel().techUsed.includes(tech)">
      {{tech}}
    </button>
    }
  </div>
  @if (signalErrors().techUsed) {
  <small class="text-danger">{{signalErrors().techUsed}}</small>
  }

  <label>WHAT DID YOU LEARN?</label>
  <textarea class="textarea" [value]="signalModel().notes"
    placeholder="Summarize the core insight or technical takeaway..."
    (input)="updateSignal('notes',$any($event.target).value)">
</textarea>

  <label>RELATIVE DIFFICULTY</label>
  <div class="difficulty">
    @for (level of DIFFICULTIES; track level) {
    <button mat-button type="button" class="difficulty-btn" (click)="setDifficulty(level)"
      [class.active]="signalModel().difficulty === level">
      {{level}}
    </button>
    }
  </div>

  <button mat-raised-button color="primary" class="submit-btn" [disabled]="hasError()" (click)="submitSignal()">
    LOG SESSION
  </button>

</div>
