<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions>
  @if(data.confirm) {
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>OK</button>
  } @else {
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>OK</button>
  }
</mat-dialog-actions>
